<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Broadcaster</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo" src="icons/icon48.png" alt="AI Broadcaster">
      <span class="title">AI Broadcaster</span>
    </div>

    <div class="prompt-section">
      <div class="textarea-wrap">
        <textarea id="prompt" placeholder="Type your prompt, or click the mic to speak..." rows="7" spellcheck="true"></textarea>
        <div id="imagePreview" class="image-preview hidden" aria-label="Attached images"></div>
        <button id="voiceBtn" class="voice-btn" title="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <div id="voiceStatus" class="voice-status hidden">Listening...</div>
    </div>

    <div class="image-section">
      <div id="dropZone" class="drop-zone">
        <input type="file" id="imageInput" accept="image/*" multiple hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="attach-icon">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <span>Attach images (click, drag, or paste)</span>
      </div>
    </div>

    <button id="broadcastBtn" class="broadcast-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      Broadcast to All AIs
    </button>

    <div class="workspace-options">
      <span class="option-label">Workspace panels</span>
      <div id="workspacePanelCount" class="panel-count" role="group" aria-label="Workspace panel count">
        <button type="button" data-count="2">2</button>
        <button type="button" data-count="3">3</button>
        <button type="button" data-count="4">4</button>
        <button type="button" data-count="5">5</button>
        <button type="button" data-count="6">6</button>
      </div>
    </div>

    <button id="workspaceBtn" class="workspace-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <line x1="9" y1="4" x2="9" y2="20"/>
        <line x1="15" y1="4" x2="15" y2="20"/>
      </svg>
      Open Workspace
    </button>

    <div id="status" class="status hidden"></div>
  </div>

  <script src="providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
